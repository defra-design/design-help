{% extends "layouts/main.html" %}

{% block pageTitle %}
Sign in - Defra Design Help
{% endblock %}

{% block content %}
<div class="govuk-grid-row">
  <div class="govuk-grid-column-two-thirds">

    {% if error %}
    <div class="govuk-error-summary" aria-labelledby="error-summary-title" role="alert"
      data-module="govuk-error-summary">
      <h2 class="govuk-error-summary__title" id="error-summary-title">
        There is a problem
      </h2>
      <div class="govuk-error-summary__body">
        <ul class="govuk-list govuk-error-summary__list">
          <li>
            <a href="#email">{{ error }}</a>
          </li>
        </ul>
      </div>
    </div>
    {% endif %}

    <h1 class="govuk-heading-xl">Sign in</h1>

    <form action="/login" method="post">

      <div class="govuk-form-group">
        <label class="govuk-label" for="email">
          Email address
        </label>
        <input class="govuk-input" id="email" name="username" type="email" autocomplete="email">
      </div>

      <div class="govuk-form-group">
        <label class="govuk-label" for="password">
          Password
        </label>
        <input class="govuk-input" id="password" name="password" type="password" autocomplete="current-password">
      </div>

      <button class="govuk-button" data-module="govuk-button" type="submit">
        Sign in
      </button>

    </form>

    <p class="govuk-body">
      <a class="govuk-link" href="/register">Create an account</a>
    </p>

  </div>
</div>
{% endblock %}
